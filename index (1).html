<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নদীপাড়ার খবর | সত্য, স্পষ্ট, সবার জন্য</title>
    
    <!-- Google Fonts: Noto Serif Bengali for headlines, Noto Sans Bengali for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&family=Noto+Serif+Bengali:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #fbfaf7;
            --text-color: #1c1917;
            --text-muted: #57534e;
            --card-bg: #ffffff;
            --border-color: #e7e5e4;
            --primary-color: #0e6b5c;
            --primary-hover: #0a574a;
            --breaking-color: #c2410c;
            --ticker-bg: #f5f5f4;
            --shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg-color: #171717;
            --text-color: #e7e5e4;
            --text-muted: #a8a29e;
            --card-bg: #202020;
            --border-color: #404040;
            --primary-color: #149c86;
            --primary-hover: #1acab0;
            --breaking-color: #ea580c;
            --ticker-bg: #262626;
            --shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            color-scheme: light dark; 
        }

        body {
            font-family: 'Noto Sans Bengali', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.75;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a { text-decoration: none; color: inherit; transition: color 0.2s; }
        ul { list-style: none; }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Noto Serif Bengali', serif;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-color);
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 0 auto;
        }

        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
            border-radius: 2px;
        }

        .section-title {
            font-size: 1.45rem;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 0.45rem;
            margin-bottom: 1.25rem;
            display: inline-block;
        }
        .bg-card {
            background-color: var(--card-bg);
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .img-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 3px;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: flex-end;
            padding: 0.75rem;
            color: rgba(255,255,255,0.9);
            font-size: 0.82rem;
            font-weight: 500;
        }
        .cat-tag {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.4rem;
            display: inline-block;
        }
        .time-stamp { font-size: 0.85rem; color: var(--text-muted); }
        .hidden { display: none !important; }

        /* --- 1. TOP BAR --- */
        .top-bar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 0;
            font-size: 0.9rem;
        }
        .top-bar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
        }
        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
        }
        .theme-toggle:hover { background-color: var(--ticker-bg); }

        /* --- 2. MASTHEAD --- */
        .masthead { padding: 1.75rem 0; text-align: center; border-bottom: 1px solid var(--border-color); }
        .site-title { font-size: 3.2rem; font-weight: 800; color: var(--primary-color); letter-spacing: -0.5px; }
        .site-tagline { font-size: 1.05rem; color: var(--text-muted); margin-top: 0.25rem; }

        /* --- 3. CATEGORY NAV --- */
        .main-nav {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }
        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .nav-list {
            display: flex;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .nav-list::-webkit-scrollbar { display: none; }
        .nav-item a {
            display: block;
            padding: 0.9rem 1rem;
            font-weight: 500;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
        }
        .nav-item a:hover, .nav-item a.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        .nav-search {
            padding: 0.45rem 0.85rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.9rem;
            width: 180px;
            flex-shrink: 0;
        }

        /* --- 4. HEADLINE TICKER --- */
        .ticker-strip {
            background-color: var(--ticker-bg);
            padding: 0.65rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.9rem;
            margin-top: 1rem;
            border-radius: 4px;
        }
        .ticker-label {
            background-color: var(--breaking-color);
            color: #ffffff;
            padding: 2px 10px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 2px;
            white-space: nowrap;
        }
        .ticker-content {
            font-weight: 500;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .ticker-content a:hover { color: var(--primary-color); text-decoration: underline; }

        /* --- 5. MAIN GRID LAYOUT --- */
        .main-content { padding: 1.75rem 0; }
        .layout-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.75rem; }

        .lead-story { margin-bottom: 1.75rem; }
        .lead-story h1 { font-size: 2.1rem; margin: 0.35rem 0 0.65rem; }
        .lead-story a:hover h1 { color: var(--primary-color); }
        .lead-summary { font-size: 1.05rem; color: var(--text-muted); margin-bottom: 0.6rem; }

        .sub-stories-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
        .sub-story h3 { font-size: 1.12rem; margin-top: 0.3rem; }
        .sub-story a:hover h3 { color: var(--primary-color); }

        .sidebar-section { margin-bottom: 1.75rem; }
        .latest-list li, .popular-list li {
            padding: 0.85rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .latest-list li:last-child, .popular-list li:last-child { border-bottom: none; }
        .latest-list li a { display: block; font-weight: 500; }
        .latest-list li a:hover { color: var(--primary-color); }
        
        .popular-list { counter-reset: pop; list-style: none; }
        .popular-list li { display: flex; gap: 0.9rem; align-items: flex-start; }
        .popular-list li::before {
            counter-increment: pop;
            content: counter(pop, bengali);
            font-family: 'Noto Serif Bengali', serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1.1;
        }
        .popular-list li a { font-weight: 500; flex: 1; }
        .popular-list li a:hover { color: var(--primary-color); }

        /* --- 6. THREE COLUMN CATEGORIES --- */
        .cat-sections { padding-bottom: 2.5rem; }
        .cat-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.75rem; }
        .cat-large-story { margin-bottom: 1rem; }
        .cat-large-story h3 { font-size: 1.28rem; margin-top: 0.35rem; }
        .cat-large-story a:hover h3 { color: var(--primary-color); }
        .cat-text-story { padding: 0.85rem 1rem; }
        .cat-text-story h4 { font-size: 1.05rem; margin-bottom: 0.35rem; }
        .cat-text-story a:hover h4 { color: var(--primary-color); }

        /* --- 7. FOOTER --- */
        footer {
            background-color: var(--card-bg);
            border-top: 2px solid var(--primary-color);
            padding: 2rem 0;
            text-align: center;
            margin-top: auto;
            font-size: 0.92rem;
        }
        .footer-links { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 0.85rem; flex-wrap: wrap; }
        .footer-links a:hover { color: var(--primary-color); }

        /* --- ARTICLE & FILTER VIEW --- */
        #article-view { padding: 2rem 0 3rem; }
        .article-headline { font-size: 2.3rem; margin-bottom: 0.85rem; }
        .article-meta {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .article-body { font-size: 1.12rem; line-height: 1.85; }
        .article-body p { margin-bottom: 1.35rem; }
        .back-btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.55rem 1.2rem;
            background-color: var(--primary-color);
            color: #ffffff;
            border-radius: 4px;
            font-weight: 500;
        }
        .back-btn:hover { background-color: var(--primary-hover); }

        .filter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 992px) {
            .layout-grid, .cat-grid-3 { grid-template-columns: 1fr; }
            .site-title { font-size: 2.5rem; }
            .sub-stories-row { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            html { font-size: 15px; }
            .container { width: 94%; }
            .sub-stories-row, .filter-grid { grid-template-columns: 1fr; }
            .masthead { padding: 1.2rem 0; }
            .site-title { font-size: 2.1rem; }
            .lead-story h1 { font-size: 1.65rem; }
            .article-headline { font-size: 1.75rem; }
            .nav-search { width: 130px; }
        }
    </style>
</head>

        <!-- 6. Three-Column Category Sections -->
        <section class="cat-sections container" id="cat-sections">
            <div class="cat-grid-3" id="cat-grid-container"></div>

        <!-- Article Detail & Search/Category Filter View -->
        <section id="article-view" class="container hidden"></section>
    </div>

    <!-- 7. Footer -->
    <footer>

    <script>
        // --- BENGALI NUMBER HELPER ---
        function toBengaliDigits(num) {
            const digits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return String(num).replace(/\d/g, d => digits[d]);
        }

        // --- REALISTIC BENGALI NEWS ARTICLES DATA ---
        const categories = ['প্রচ্ছদ', 'বাংলাদেশ', 'রাজনীতি', 'অর্থনীতি', 'খেলা', 'বিশ্ব', 'বিনোদন', 'প্রযুক্তি', 'মতামত'];

        const articles = [
            {
                id: 1,
                category: 'বাংলাদেশ',
                headline: 'পদ্মা-মেঘনা অববাহিকায় নাব্যতা ফেরাতে নতুন ড্রেজিং প্রকল্প অনুমোদন',
                summary: 'সারা বছর নৌযান চলাচল স্বাভাবিক রাখতে এবং নদীভাঙন রোধে ১২টি গুরুত্বপূর্ণ নৌরুটে আধুনিক খননকাজ শুরু হচ্ছে আগামী মাসেই।',
                body: 'নৌপরিবহন মন্ত্রণালয়ের নতুন এই মহাপরিকল্পনার আওতায় দেশের দক্ষিণাঞ্চলের সাথে রাজধানীর নৌযোগাযোগ আরও নিরাপদ ও দ্রুততর হবে। বিশেষজ্ঞরা বলছেন, শুষ্ক মৌসুমে নাব্যতা সংকটের কারণে পণ্যবাহী জাহাজ চলাচলে যে বিঘ্ন ঘটত, তা এই প্রকল্পের মাধ্যমে অনেকাংশে কমে আসবে।

প্রকল্প পরিচালক জানিয়েছেন, আধুনিক জিপিএস-নিয়ন্ত্রিত ড্রেজার ব্যবহার করে নদীর গতিপথ ঠিক রাখা হবে এবং উত্তোলিত বালু পরিকল্পিতভাবে তীর রক্ষার কাজে ব্যবহৃত হবে। স্থানীয় মৎস্যজীবী ও নৌযান চালকরা এই সিদ্ধান্তকে স্বাগত জানিয়েছেন।',
                gradient: 'linear-gradient(135deg, #0e6b5c 0%, #1d4ed8 100%)',
                caption: 'নদী খনন ও নৌপথ উন্নয়ন প্রকল্পের নকশা চিত্র',
                minutesAgo: 8,
                views: 4820,
                isBreaking: true
            },
            {
                id: 2,
                category: 'অর্থনীতি',
                headline: 'চলতি অর্থবছরে কৃষি ও প্রক্রিয়াজাত খাদ্য রপ্তানিতে নতুন রেকর্ড',
                summary: 'ইউরোপ ও মধ্যপ্রাচ্যের বাজারে দেশীয় সবজি, মসলা ও শুকনো খাবারের চাহিদা বাড়ায় রপ্তানি আয় বেড়েছে ১৮ শতাংশ।',
                body: 'রপ্তানি উন্নয়ন ব্যুরোর সর্বশেষ প্রতিবেদনে দেখা গেছে, প্রচলিত পোশাক খাতের পাশাপাশি কৃষি প্রক্রিয়াজাত পণ্য এখন বৈদেশিক মুদ্রা অর্জনের অন্যতম প্রধান উৎসে পরিণত হচ্ছে। মানসম্মত প্যাকেজিং ও আন্তর্জাতিক মানদণ্ড বজায় রাখায় নতুন ক্রেতা দেশ যুক্ত হচ্ছে।

উদ্যোক্তারা জানান, হিমাগার সুবিধা ও কার্গো বিমানের ভাড়া কিছুটা কমানো গেলে আগামী দুই বছরে এই খাতের আয় দ্বিগুণ করা সম্ভব।',
                gradient: 'linear-gradient(135deg, #15803d 0%, #ca8a04 100%)',
                caption: 'রপ্তানিযোগ্য কৃষিপণ্য প্রক্রিয়াজাতকরণ কেন্দ্র',
                minutesAgo: 15,
                views: 3910,
                isBreaking: true
            },
            {
                id: 3,
                category: 'খেলা',
                headline: 'চট্টগ্রাম টেস্টে স্পিনারদের দাপটে চালকের আসনে স্বাগতিকরা',

                            <span>${a.category}</span>
                        </div>
                        <span class="cat-tag">${a.category}</span>
                        <h3>${a.headline}</h3>
                        <span class="time-stamp" style="display:block; margin-top:0.4rem;">${toBengaliDigits(a.minutesAgo)} মিনিট আগে</span>
                    </a>
                </article>
            `).join('');

            const latestSorted = [...articles].sort((a, b) => a.minutesAgo - b.minutesAgo).slice(0, 6);
            els.latest.innerHTML = latestSorted.map(a => `
                <li>
                    <a href="#article-${a.id}">${a.headline}</a>
                    <span class="time-stamp">${toBengaliDigits(a.minutesAgo)} মিনিট আগে</span>
                </li>
            `).join('');

            const popularSorted = [...articles].sort((a, b) => b.views - a.views).slice(0, 5);
            els.popular.innerHTML = popularSorted.map(a => `
                <li>
                    <a href="#article-${a.id}">${a.headline}</a>
                </li>
            `).join('');
        }

        // 5. RENDER THREE-COLUMN CATEGORY SECTIONS
        function renderCategorySections() {
            const displayCats = ['বাংলাদেশ', 'খেলা', 'বিশ্ব'];
            els.catGrid.innerHTML = displayCats.map(catName => {
                const catArts = articles.filter(a => a.category === catName);
                const imgStory = catArts[0];
                const textStory = catArts[1] || catArts[0];

                return `
                    <div class="cat-block">
                        <h2 class="section-title"><a href="#cat-${encodeURIComponent(catName)}">${catName}</a></h2>
                        <article class="cat-large-story bg-card">
                            <a href="#article-${imgStory.id}">
                                <div class="img-placeholder" style="background: ${imgStory.gradient};">
                                    <span>${imgStory.caption}</span>
                                </div>
                                <h3>${imgStory.headline}</h3>
                                <span class="time-stamp" style="display:block; margin-top:0.35rem;">${toBengaliDigits(imgStory.minutesAgo)} মিনিট আগে</span>
                            </a>
                        </article>
                        <article class="cat-text-story bg-card">
                            <a href="#article-${textStory.id}">
                                <h4>${textStory.headline}</h4>
                                <p style="font-size:0.9rem; color:var(--text-muted);">${textStory.summary}</p>
                            </a>
                        </article>
                    </div>
                `;
            }).join('');
        }

        // 6. VIEWS: HOME, CATEGORY FILTER, LIVE SEARCH, ARTICLE DETAIL
        function showHome() {
            els.homeSec.classList.remove('hidden');
            els.catSecs.classList.remove('hidden');
            els.articleView.classList.add('hidden');
            renderNav('প্রচ্ছদ');
        }

        function showCategory(catName) {
            if (catName === 'প্রচ্ছদ') {
                showHome();
                return;
            }
            const filtered = articles.filter(a => a.category === catName);
            els.homeSec.classList.add('hidden');
            els.catSecs.classList.add('hidden');
            els.articleView.classList.remove('hidden');
            renderNav(catName);

            els.articleView.innerHTML = `
                <h2 class="section-title" style="font-size:1.85rem;">${catName}</h2>
                <div class="filter-grid">
                    ${filtered.map(a => `
                        <article class="bg-card">
                            <a href="#article-${a.id}">
                                <div class="img-placeholder" style="background: ${a.gradient};">
                                    <span>${a.caption}</span>
                                </div>
                                <h3 style="font-size:1.3rem; margin-bottom:0.4rem;">${a.headline}</h3>
                                <p style="color:var(--text-muted); font-size:0.95rem;">${a.summary}</p>
                                <span class="time-stamp" style="display:block; margin-top:0.5rem;">${toBengaliDigits(a.minutesAgo)} মিনিট আগে</span>
                            </a>
                        </article>
                    `).join('')}
                </div>
                <a href="#" class="back-btn" id="back-to-home">← প্রচ্ছদে ফিরে যান</a>
            `;
            window.scrollTo(0, 0);
        }

        function showArticle(id) {
            const art = articles.find(a => a.id === id);
            if (!art) {
                showHome();
                return;
            }
            els.homeSec.classList.add('hidden');
            els.catSecs.classList.add('hidden');
            els.articleView.classList.remove('hidden');
            renderNav(art.category);

            const pubDate = new Date().toLocaleDateString('bn-BD', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            els.articleView.innerHTML = `
                <article class="bg-card" style="padding: 1.75rem;">
                    <span class="cat-tag">${art.category}</span>
                    <h1 class="article-headline">${art.headline}</h1>
                    <div class="article-meta">
                        <span>প্রকাশিত: ${pubDate} (${toBengaliDigits(art.minutesAgo)} মিনিট আগে)</span>
                        <span>পঠিত: ${toBengaliDigits(art.views)} বার</span>
                    </div>
                    <div class="img-placeholder" style="background: ${art.gradient}; margin-bottom: 1.5rem;">
                        <span>${art.caption}</span>
                    </div>
                    <div class="article-body">
                        ${art.body.split('

').map(p => `<p>${p}</p>`).join('')}
                    </div>
                    <a href="#" class="back-btn" id="back-to-home">← প্রচ্ছদে ফিরে যান</a>
                </article>
            `;
            window.scrollTo(0, 0);
        }

        // LIVE SEARCH
        els.searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim().toLowerCase();
            if (!q) {
                if (window.location.hash) {
                    handleRoute();
                } else {
                    showHome();
                }
                return;
            }

            const matches = articles.filter(a =>
                a.headline.toLowerCase().includes(q) ||
                a.summary.toLowerCase().includes(q) ||
                a.category.toLowerCase().includes(q)
            );

            els.homeSec.classList.add('hidden');
            els.catSecs.classList.add('hidden');
            els.articleView.classList.remove('hidden');

            els.articleView.innerHTML = `
                <h2 class="section-title">অনুসন্ধানের ফলাফল: "${e.target.value}" (${toBengaliDigits(matches.length)}টি)</h2>
                ${matches.length === 0
                    ? '<p class="bg-card">দুঃখিত, আপনার অনুসন্ধানের সাথে মিলে এমন কোনো সংবাদ পাওয়া যায়নি।</p>'
                    : `<div class="filter-grid">
                        ${matches.map(a => `
                            <article class="bg-card">
                                <a href="#article-${a.id}">
                                    <span class="cat-tag">${a.category}</span>
                                    <h3 style="font-size:1.25rem; margin-bottom:0.4rem;">${a.headline}</h3>
                                    <p style="color:var(--text-muted); font-size:0.95rem;">${a.summary}</p>
                                </a>
                            </article>
                        `).join('')}
                    </div>`
                }
                <a href="#" class="back-btn" id="back-to-home">← প্রচ্ছদে ফিরে যান</a>
            `;
        });

        // HASH ROUTING
        function handleRoute() {
            const hash = window.location.hash;
            if (hash.startsWith('#article-')) {
                const id = parseInt(hash.replace('#article-', ''), 10);
                showArticle(id);
            } else if (hash.startsWith('#cat-')) {
                const cat = decodeURIComponent(hash.replace('#cat-', ''));
                showCategory(cat);
            } else {
                showHome();
            }
        }

        window.addEventListener('hashchange', handleRoute);

        document.addEventListener('click', (e) => {
            if (e.target.id === 'back-to-home' || e.target.closest('#brand-link')) {
                e.preventDefault();
                els.searchInput.value = '';
                history.pushState('', document.title, window.location.pathname + window.location.search);
                showHome();
                window.scrollTo(0, 0);
            }
        });

        // LIGHT & DARK MODE
        const htmlEl = document.documentElement;
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('nodiparar-theme');

        function applyTheme(theme) {
            htmlEl.setAttribute('data-theme', theme);
            els.themeToggle.textContent = theme === 'dark' ? 'লাইট মোড' : 'ডার্ক মোড';
        }

        applyTheme(savedTheme || (systemDark ? 'dark' : 'light'));

        els.themeToggle.addEventListener('click', () => {
            const nextTheme = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('nodiparar-theme', nextTheme);
            applyTheme(nextTheme);
        });

        // INITIALIZE
        renderNav();
        renderTicker();
        renderHomepage();
        renderCategorySections();
        handleRoute();
    </script>
</body>
</html>
